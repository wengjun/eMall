{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    {{- include "emall.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: {{ default $.Values.serviceDefaults.replicas .replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ .name }}
        app: {{ .name }}
        emall.io/gateway-reachable: "true"
        {{- if .rpcProvider }}
        emall.io/rpc-provider: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ .name }}
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.repositoryPrefix }}/{{ .name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .port }}
            {{- if .rpcProvider }}
            - name: dubbo
              containerPort: 20880
            {{- end }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "redis-cluster"
            - name: MODULE
              value: {{ .name | quote }}
            {{- if .sharding }}
            - name: EMALL_SHARDING_ENABLED
              value: "true"
            - name: EMALL_SHARDING_DATASOURCE_ENABLED
              value: "true"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "emall.fullname" $ }}-runtime
            - secretRef:
                name: {{ $.Values.global.existingSecret }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.serviceDefaults.resources | nindent 12 }}
{{- end }}
