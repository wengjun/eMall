apiVersion: batch/v1
kind: Job
metadata:
  name: emall-migration-runner
  labels:
    app.kubernetes.io/name: emall
    app.kubernetes.io/component: migration-runner
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emall
        app.kubernetes.io/component: migration-runner
    spec:
      restartPolicy: Never
      serviceAccountName: emall-migration-runner
      containers:
        - name: migration-runner
          image: emall/migration-runner:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: EMALL_MIGRATION_OPERATOR
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['emall.io/operator']
            - name: EMALL_MIGRATION_SERVICES
              value: "advertising,after-sales,analytics,cart,catalog,cost,customer-service,data-warehouse,event-platform,experiment,finance,flash-sale,forecasting,fulfillment,identity,intelligence,inventory,marketing,merchant,openapi,operations,order,payment,platform-ops,pricing,product,promotion,recommendation,release,reliability,review,risk,search,supply-chain,traffic,user"
            - name: EMALL_MIGRATION_REGIONS
              value: "default"
            - name: EMALL_MIGRATION_JDBC_URL_TEMPLATE
              value: "jdbc:mysql://mysql:3306/{database}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true"
            - name: EMALL_MIGRATION_LOCATIONS
              value: "classpath:migrations/{service}/src/main/resources/db/migration"
            - name: EMALL_MIGRATION_BASELINE_ON_MIGRATE
              value: "false"
            - name: EMALL_MIGRATION_CREATE_PHYSICAL_TABLES
              value: "true"
            - name: EMALL_TABLE_SHARD_COUNT
              value: "64"
          envFrom:
            - secretRef:
                name: emall-runtime-secret
