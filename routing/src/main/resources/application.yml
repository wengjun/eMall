server:
  port: 8117

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","service":"${spring.application.name}","traceId":"%X{traceId:-}","spanId":"%X{spanId:-}","requestId":"%X{requestId:-}","userId":"%X{userId:-}","orderId":"%X{orderId:-}","route":"%X{route:-}","status":"%X{status:-}","latencyMs":"%X{latencyMs:-}","thread":"%thread","logger":"%logger{40}","message":"%replace(%msg){''"'',''\"''}","exception":"%replace(%ex{short}){''"'',''\"''}"}%n'

spring:
  application:
    name: routing
  cloud:
    nacos:
      server-addr: ${EMALL_NACOS_SERVER_ADDR:localhost:8848}
      discovery:
        enabled: ${EMALL_NACOS_DISCOVERY_ENABLED:false}
        namespace: ${EMALL_NACOS_NAMESPACE:public}
        group: ${EMALL_NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${EMALL_NACOS_CONFIG_ENABLED:false}
        import-check:
          enabled: false
    sentinel:
      enabled: ${EMALL_SENTINEL_ENABLED:false}
      transport:
        dashboard: ${EMALL_SENTINEL_DASHBOARD:localhost:8858}
        port: ${EMALL_SENTINEL_API_PORT:8719}
  datasource:
    url: ${EMALL_ROUTING_DB_URL:jdbc:mysql://localhost:3306/emall_routing?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${EMALL_DB_USERNAME:root}
    password: ${EMALL_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: ${EMALL_FLYWAY_ENABLED:false}
  data:
    redis:
      host: ${EMALL_REDIS_HOST:localhost}
      port: ${EMALL_REDIS_PORT:6379}

emall:
  storage: jdbc
  internal:
    operations-token: ${EMALL_INTERNAL_OPERATIONS_TOKEN:local-dev-token}
  security:
    auth:
      public-endpoints:
        - "GET:/actuator/health/**"
        - "GET:/actuator/info"
        - "*:/internal/shard-routes/**"
        - "*:/internal/virtual-shards/**"
  sharding:
    enabled: false
    datasource:
      enabled: false
  routing:
    virtual-shard-migration:
      virtual-shard-count: ${EMALL_VIRTUAL_SHARD_COUNT:4096}
      mapping-cache-ttl: ${EMALL_SHARDING_MAPPING_CACHE_TTL:30s}
      minimum-cutover-delay: ${EMALL_SHARDING_MINIMUM_CUTOVER_DELAY:60s}
      observation-period: ${EMALL_SHARDING_OBSERVATION_PERIOD:10m}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${EMALL_TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${EMALL_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
