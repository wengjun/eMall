spring:
  application:
    name: migration-runner
  main:
    web-application-type: none
  flyway:
    enabled: false

emall:
  migration:
    dry-run: ${EMALL_MIGRATION_DRY_RUN:false}
    baseline-on-migrate: ${EMALL_MIGRATION_BASELINE_ON_MIGRATE:false}
    operator: ${EMALL_MIGRATION_OPERATOR:unknown}
    jdbc-url-template: ${EMALL_MIGRATION_JDBC_URL_TEMPLATE:}
    username: ${EMALL_MIGRATION_DB_USERNAME:}
    password: ${EMALL_MIGRATION_DB_PASSWORD:}
    history-table: ${EMALL_MIGRATION_HISTORY_TABLE:flyway_schema_history}
    create-physical-tables: ${EMALL_MIGRATION_CREATE_PHYSICAL_TABLES:false}
    default-table-shard-count: ${EMALL_TABLE_SHARD_COUNT:64}
    cell-id: ${EMALL_CELL_ID:cell-a}
    services: ${EMALL_MIGRATION_SERVICES:}
    regions: ${EMALL_MIGRATION_REGIONS:default}
    shards: ${EMALL_MIGRATION_SHARDS:}
    default-service-shard-count: 1
    service-shard-counts:
      user: ${EMALL_USER_DB_SHARD_COUNT:${EMALL_DB_SHARD_COUNT:8}}
      product: ${EMALL_PRODUCT_DB_SHARD_COUNT:${EMALL_DB_SHARD_COUNT:8}}
      inventory: ${EMALL_INVENTORY_DB_SHARD_COUNT:${EMALL_DB_SHARD_COUNT:8}}
      order: ${EMALL_ORDER_DB_SHARD_COUNT:${EMALL_DB_SHARD_COUNT:8}}
      cart: ${EMALL_CART_DB_SHARD_COUNT:${EMALL_DB_SHARD_COUNT:8}}
      payment: ${EMALL_PAYMENT_DB_SHARD_COUNT:${EMALL_DB_SHARD_COUNT:8}}
      pricing: ${EMALL_PRICING_DB_SHARD_COUNT:${EMALL_DB_SHARD_COUNT:8}}
      marketing: ${EMALL_MARKETING_DB_SHARD_COUNT:${EMALL_DB_SHARD_COUNT:8}}
      search: ${EMALL_SEARCH_DB_SHARD_COUNT:${EMALL_DB_SHARD_COUNT:8}}
      flash-sale: ${EMALL_FLASH_SALE_DB_SHARD_COUNT:${EMALL_DB_SHARD_COUNT:8}}
    locations: ${EMALL_MIGRATION_LOCATIONS:classpath:migrations/{service}/src/main/resources/db/migration}
