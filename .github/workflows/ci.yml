name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Validate formatting and static checks
        run: mvn -B validate formatter:validate
      - name: Compile and run unit tests
        run: mvn -B -DskipITs=true test

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run all unit and integration tests with coverage gates
        run: mvn -B -DskipITs=false -Demall.integration.require-docker=true verify
      - name: Verify immutable migration assets
        run: jar tf migration-runner/target/migration-runner-0.1.0-SNAPSHOT.jar | grep '^BOOT-INF/classes/migrations/'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan source and deployment configuration
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
